<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>용호골목시장 메뉴판</title>


  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
    }


    .container {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px;
    }


    /* =========================
       용호골목시장 로고
    ========================= */

    .logo {
      text-align: center;
      margin-bottom: 15px;
    }


    .logo img {
      width: 180px;
      max-height: 100px;
      object-fit: contain;
    }


    /* =========================
       매장명
    ========================= */

    .store-name {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 15px;
    }


    /* =========================
       대표사진
       1:1 정사각형
    ========================= */

    .store-photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      margin: 0 auto 20px;
      display: none;
    }


    /* =========================
       언어 선택
    ========================= */

    .languages {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
    }


    .language {
      flex: 1;
      padding: 12px 5px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }


    .language.active {
      background: #222;
      color: white;
    }


    /* =========================
       메뉴
    ========================= */

    .menu {
      background: white;
      padding: 18px;
      margin-bottom: 10px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }


    .menu-name {
      font-size: 18px;
      word-break: keep-all;
    }


    .price {
      font-size: 17px;
      font-weight: bold;
      white-space: nowrap;
    }


    .empty-message {
      text-align: center;
      color: #777;
      padding: 30px 0;
    }

  </style>

</head>


<body>


<div class="container">


  <!-- =========================
       용호골목시장 로고
  ========================= -->

  <div class="logo">

    <img
      src="https://drive.google.com/thumbnail?id=1LKz6Oif7BQJSjhsfiSOym0jzzQKlbumn&sz=w500"
      alt="용호골목시장 로고"
    >

  </div>


  <!-- =========================
       매장명
  ========================= -->

  <div
    id="storeName"
    class="store-name"
  >
    메뉴판
  </div>


  <!-- =========================
       대표사진
       1:1
  ========================= -->

  <img
    id="storePhoto"
    class="store-photo"
    alt="매장 대표사진"
  >


  <!-- =========================
       언어 선택
  ========================= -->

  <div class="languages">

    <button
      class="language active"
      onclick="changeLanguage('KR', this)"
    >
      한국어
    </button>

    <button
      class="language"
      onclick="changeLanguage('EN', this)"
    >
      English
    </button>

    <button
      class="language"
      onclick="changeLanguage('JP', this)"
    >
      日本語
    </button>

    <button
      class="language"
      onclick="changeLanguage('CN', this)"
    >
      中文
    </button>

  </div>


  <!-- =========================
       메뉴
  ========================= -->

  <div id="menuList"></div>


</div>



<script>


/* =========================
   기본 설정
========================= */

let menuData = [];

let currentLanguage = "KR";



/* =========================
   URL에서 점포ID 가져오기
========================= */

const urlParams =
  new URLSearchParams(
    window.location.search
  );


const storeId =
  urlParams.get("storeId") || "";



/* =========================
   Apps Script 주소
========================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbwtb2Bag4i1PRkq7NBiqmv-JXBOSv_6TiHqz8Wr-s4xhfo3IPPrSXIznl6BhK_VCD35/exec";



/* =========================
   JSONP callback
========================= */

const callbackName =
  "menuCallback_" + Date.now();


window[callbackName] = function(data) {


  console.log("받은 데이터:", data);


  /* =====================
     매장명 표시
  ===================== */

  document
    .getElementById("storeName")
    .textContent =
      data.storeName || "메뉴판";


  /* =====================
     대표사진 표시
  ===================== */

  const photo =
    document.getElementById("storePhoto");


  if (
    data.photo &&
    String(data.photo).trim() !== ""
  ) {

    photo.src =
      data.photo;

    photo.style.display =
      "block";


    photo.onerror = function() {

      this.style.display =
        "none";

    };

  } else {

    photo.style.display =
      "none";

  }


  /* =====================
     메뉴 데이터
  ===================== */

  menuData =
    data.menus || [];


  renderMenu();


  /* callback 제거 */

  delete window[callbackName];

};



/* =========================
   Apps Script 데이터 요청
========================= */

const script =
  document.createElement("script");


script.src =
  API_URL +
  "?action=getMenu" +
  "&storeId=" +
  encodeURIComponent(storeId) +
  "&callback=" +
  callbackName;


script.onerror = function() {

  document
    .getElementById("menuList")
    .innerHTML =
      '<p class="empty-message">메뉴를 불러오지 못했습니다.</p>';

};


document.body.appendChild(script);



/* =========================
   메뉴 표시
========================= */

function renderMenu() {


  const menuList =
    document.getElementById("menuList");


  menuList.innerHTML = "";


  if (menuData.length === 0) {

    menuList.innerHTML =
      '<p class="empty-message">등록된 메뉴가 없습니다.</p>';

    return;

  }


  menuData.forEach(function(item) {


    let menuName = "";


    if (
      currentLanguage === "KR"
    ) {

      menuName =
        item.menuKR;

    }


    if (
      currentLanguage === "EN"
    ) {

      menuName =
        item.menuEN;

    }


    if (
      currentLanguage === "JP"
    ) {

      menuName =
        item.menuJP;

    }


    if (
      currentLanguage === "CN"
    ) {

      menuName =
        item.menuCN;

    }


    const menu =
      document.createElement("div");


    menu.className =
      "menu";


    menu.innerHTML = `

      <div class="menu-name">

        ${menuName || ""}

      </div>

      <div class="price">

        ${Number(
          item.price
        ).toLocaleString()}원

      </div>

    `;


    menuList.appendChild(menu);

  });

}



/* =========================
   언어 변경
========================= */

function changeLanguage(
  language,
  button
) {


  currentLanguage =
    language;


  document
    .querySelectorAll(".language")
    .forEach(function(btn) {

      btn.classList.remove(
        "active"
      );

    });


  button.classList.add(
    "active"
  );


  renderMenu();

}


</script>


</body>

</html>
